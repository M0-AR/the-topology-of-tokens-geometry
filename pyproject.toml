[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "topobpe"
version = "0.1.0"
description = "Topological signatures of byte-pair encodings, tokenizer compression, and bits-per-byte"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TopoBPE contributors" }]
keywords = ["tokenization", "persistent homology", "bits-per-byte", "BPE", "TDA"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "datasets>=5.0.0",
  "gudhi>=3.11.0",
  "huggingface-hub>=0.36.0",
  "matplotlib>=3.10.0",
  "numpy>=2.2.0",
  "pandas>=2.2.0",
  "persim>=0.3.0",
  "pyarrow>=21.0.0",
  "pyyaml>=6.0.0",
  "requests>=2.32.0",
  "ripser>=0.6.0",
  "scikit-learn>=1.9.0",
  "scipy>=1.13.0",
  "statsmodels>=0.15.0",
  "tokenizers>=0.22.0",
  "torch>=2.7.0",
  "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0", "ruff>=0.14.0", "mypy>=1.19.0"]

[project.scripts]
topobpe = "topobpe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/topobpe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
