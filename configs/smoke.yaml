project:
  name: topobpe-smoke
  seed: 20261105
  artifact_dir: artifacts-smoke
  results_dir: results-smoke

data:
  data_dir: data-smoke/processed
  docs_per_corpus: 200
  min_chars: 200
  max_chars: 20000
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  corpora:
    - name: wikitext_en
      hf_id: Salesforce/wikitext
      hf_config: wikitext-103-raw-v1
      split: train
      field: text
      language: en
      domain: prose
    - name: codeparrot_py
      hf_id: codeparrot/codeparrot-clean
      hf_config: null
      split: train
      field: content
      language: py
      domain: code

tokenizers:
  families:
    - bpe
    - unigram
  vocab_sizes:
    - 512
    - 1024
  min_frequency: 2
  special_tokens:
    - <pad>
    - <bos>
    - <eos>
    - <unk>
  byte_level: true
  sample_bytes_for_training: 2000000

features:
  vocab_points: 128
  cooccurrence_tokens: 128
  cooccurrence_window: 3
  cooccurrence_docs: 32
  byte_ngram_dim: 32
  byte_ngram_max: 2
  maxdim: 1
  persistence_thresholds:
    - 0.05
    - 0.10

model:
  d_model: 64
  n_layers: 2
  n_heads: 2
  d_ff: 128
  dropout: 0.0
  context_length: 128
  vocab_capacity: 1024
  byte_chunk: 256
  batch_size: 4
  steps: 40
  warmup_steps: 5
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  eval_interval: 20
  bf16: true
  tokenizer_families:
    - bpe
  seeds:
    - 13

analysis:
  outer_folds: leave_one_corpus_out
  ridge_alphas:
    - 0.01
    - 0.1
    - 1.0
    - 10.0
  bootstrap_iterations: 50
  permutation_iterations: 50
  confidence: 0.95
  primary_targets:
    - compression
    - bpb

market:
  enabled: true
  cache_dir: data-smoke/market
  tickers:
    - AAPL
    - MSFT
  ranges:
    - range: 10y
      interval: 1d
  endpoint: https://query1.finance.yahoo.com/v8/finance/chart
  nasdaq_endpoint: https://api.nasdaq.com/api/quote
  user_agent: Mozilla/5.0 (research; topobpe-smoke)
  train_end: 2023-12-31
  val_end: 2024-12-31
  max_retries: 3
  sleep_seconds: 1
