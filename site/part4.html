
<script>window.DATA = /*__DATA__*/;</script>
<script>
(function(){
  "use strict";
  const DATA = window.DATA;
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const fmt = (n, d) => (n === null || n === undefined || Number.isNaN(n)) ? "—" : Number(n).toFixed(d === undefined ? 2 : d);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const labelOf = id => (DATA.corpora.find(c => c.id === id) || {label:id}).label;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- nav / progress / reveal ---------- */
  const nav = $("#nav"), progress = $("#progress");
  function onScroll(){
    const y = window.scrollY;
    nav.classList.toggle("scrolled", y > 10);
    const h = document.documentElement.scrollHeight - window.innerHeight;
    progress.style.width = (h > 0 ? (y / h) * 100 : 0) + "%";
  }
  window.addEventListener("scroll", onScroll, {passive:true}); onScroll();
  const burger = $("#navBurger"), navBox = $("#navLinks");
  if (burger && navBox) {
    const closeNav = () => { nav.classList.remove("open"); burger.setAttribute("aria-expanded", "false"); burger.setAttribute("aria-label", "Open menu"); };
    burger.addEventListener("click", e => {
      e.stopPropagation();
      const open = nav.classList.toggle("open");
      burger.setAttribute("aria-expanded", String(open));
      burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    });
    navBox.addEventListener("click", e => { if (e.target.closest("a")) closeNav(); });
    document.addEventListener("click", e => { if (nav.classList.contains("open") && !nav.contains(e.target)) closeNav(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeNav(); });
  }
  const links = $$(".nav-links a");
  const secs = links.map(a => document.getElementById(a.getAttribute("href").slice(1))).filter(Boolean);
  const navObs = new IntersectionObserver(es => {
    es.forEach(e => { if(e.isIntersecting){ links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id)); } });
  }, {rootMargin:"-45% 0px -50% 0px"});
  secs.forEach(s => navObs.observe(s));
  const revObs = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); revObs.unobserve(e.target); } }), {threshold:.08});
  $$(".reveal").forEach(el => { if(reduce) el.classList.add("in"); else revObs.observe(el); });

  /* ---------- hero counters ---------- */
  $("#hsTok").textContent = DATA.meta.tokenizers;
  $("#hsLang").textContent = DATA.meta.languages;
  $("#hsRuns").textContent = DATA.meta.lm_runs;
  $("#hsPerm").textContent = DATA.meta.permutations.toLocaleString();
  $("#evFiles").textContent = DATA.meta.files || 332;
  $("#footDate").textContent = (DATA.meta.created_at || "").slice(0,10) || "the frozen protocol";

  /* ---------- baseline tags ---------- */
  const baseline = ["actual_vocab_size","byte_entropy","token_entropy","conditional_entropy","type_token_ratio","gzip_ratio","mean_token_bytes","train_compression"];
  $("#baselineTags").innerHTML = baseline.map(b => `<span class="pill" style="text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:.66rem">${esc(b)}</span>`).join("");
  $("#pcaNote").textContent = `PCA of the 80 measured features · PC1 ${DATA.meta.pca_explained[0]}% · PC2 ${DATA.meta.pca_explained[1]}% · PC3 ${DATA.meta.pca_explained[2]}% of variance · each point is a real tokenizer, not an illustration.`;

  /* ---------- explorer ---------- */
  const exCorpus = $("#exCorpus"), exFamily = $("#exFamily"), exVocab = $("#exVocab"), exVolume = $("#exVolume"), exPrice = $("#exPrice");
  DATA.corpora.forEach(c => { const o = document.createElement("option"); o.value = c.id; o.textContent = `${c.label} (${c.language})`; exCorpus.appendChild(o); });
  function rowsFor(){ return DATA.tokenizers.filter(r => r.corpus === exCorpus.value && r.family === exFamily.value); }
  function currentRow(){
    const rows = rowsFor();
    return rows.find(r => r.vocab === Number(exVocab.value)) || rows[0];
  }
  function costFor(row, gb, price){
    const t = (gb * 1e9) / row.compression;
    return {tokens:t, cost:(t / 1e6) * price};
  }
  function renderExplorer(){
    const row = currentRow();
    if(!row) return;
    const gb = Math.max(0, Number(exVolume.value) || 0);
    const price = Math.max(0, Number(exPrice.value) || 0);
    const rows = rowsFor().sort((a,b) => a.vocab - b.vocab);
    const best = rows.slice().sort((a,b) => b.compression - a.compression)[0];
    const worst = rows.slice().sort((a,b) => a.compression - b.compression)[0];
    const c = costFor(row, gb, price), cb = costFor(best, gb, price), cw = costFor(worst, gb, price);
    $("#exComp").textContent = fmt(row.compression, 3);
    $("#exBpb").textContent = row.bpb === null ? "—" : fmt(row.bpb, 3);
    $("#exBpbSub").textContent = row.bpb === null ? "not measured for Unigram" : "BPE language model · mean of 2 seeds";
    $("#exTokGb").textContent = (1e9 / row.compression / 1e6).toFixed(1) + "M";
    $("#exCost").textContent = "$" + c.cost.toLocaleString(undefined, {maximumFractionDigits:0});
    const save = c.cost - cb.cost;
    $("#exSave").textContent = save > 0.5 ? "$" + save.toLocaleString(undefined, {maximumFractionDigits:0}) + " / mo" : "already optimal";
    $("#exSave").style.color = save > 0.5 ? "var(--amber)" : "var(--green)";
    $("#exBars").innerHTML = rows.map(r => {
      const rc = costFor(r, gb, price).cost;
      const w = Math.max(2, (rc / Math.max(cw.cost, 1)) * 100);
      return `<div class="cbar ${r.vocab === row.vocab ? "current" : ""}"><span class="mono">${r.vocab.toLocaleString()}</span><div class="track"><div class="fill" style="width:${w}%"></div></div><span class="val">$${rc.toLocaleString(undefined,{maximumFractionDigits:0})}</span></div>`;
    }).join("");
    const diff = row.compression >= best.compression ? 0 : ((best.compression / row.compression) - 1) * 100;
    $("#exNote").innerHTML = `Same text volume, ${gb.toLocaleString()} GB/month at $${price.toFixed(2)} per 1M input tokens. Best config in this corpus: <b style="color:var(--teal)">${best.vocab.toLocaleString()}</b> at ${fmt(best.compression,3)} bytes/token. This configuration needs <b style="color:${diff>0?"var(--amber)":"var(--green)"}">${diff.toFixed(1)}% ${diff>0?"more":"fewer"}</b> tokens than the best. Price is illustrative; substitute your contract rate.`;
    $("#exTags").innerHTML = `<span class="pill" style="text-transform:none">${DATA.meta.topology_features} topology features</span><span class="pill" style="text-transform:none">${DATA.meta.baseline_features} baseline features</span><span class="pill" style="text-transform:none">held-out split</span>`;
  }
  ["change","input"].forEach(ev => { exCorpus.addEventListener(ev, renderExplorer); exFamily.addEventListener(ev, renderExplorer); exVocab.addEventListener(ev, renderExplorer); exVolume.addEventListener(ev, renderExplorer); exPrice.addEventListener(ev, renderExplorer); });
  renderExplorer();

  /* ---------- chart helpers ---------- */
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, txt){ const n = document.createElementNS(NS, tag); if(attrs) for(const k in attrs) n.setAttribute(k, attrs[k]); if(txt !== undefined) n.textContent = txt; return n; }
  function svgRoot(w, h){ const s = el("svg", {viewBox:`0 0 ${w} ${h}`, role:"img"}); s.style.width = "100%"; s.style.height = "auto"; return s; }

  function r2Chart(mount, d, title){
    const W = 460, H = 280, pad = {l:40, r:16, t:18, b:44};
    const s = svgRoot(W, H); s.setAttribute("aria-label", title);
    const minV = -1.0, maxV = 1.1;
    const y = v => pad.t + (maxV - v) / (maxV - minV) * (H - pad.t - pad.b);
    for(let v = -1; v <= 1; v += .5){
      s.appendChild(el("line", {x1:pad.l, x2:W-pad.r, y1:y(v), y2:y(v), stroke:"rgba(148,163,184,.12)", "stroke-width":1}));
      s.appendChild(el("text", {x:pad.l-8, y:y(v)+4, fill:"#64748b", "font-size":10, "text-anchor":"end", "font-family":"var(--mono)"}, v.toFixed(1)));
    }
    s.appendChild(el("line", {x1:pad.l, x2:W-pad.r, y1:y(0), y2:y(0), stroke:"rgba(148,163,184,.35)", "stroke-width":1}));
    const order = [["baseline","Baseline","#5eead4"],["full","+ Topology","#fbbf24"],["topology","Topology only","#f472b6"]];
    const bw = (W - pad.l - pad.r) / 3;
    order.forEach(([key, lab, col], i) => {
      const m = d.metrics[key];
      if(!m) return;
      const x = pad.l + i * bw + bw/2;
      const top = y(Math.max(0, m.r2)), bot = y(Math.min(0, m.r2));
      s.appendChild(el("rect", {x:x-38, y:Math.min(top,bot), width:76, height:Math.max(2, Math.abs(bot-top)), rx:5, fill:col, opacity:key==="baseline"? .9 : .75}));
      s.appendChild(el("text", {x, y: m.r2 >= 0 ? top-8 : bot+14, fill:col, "font-size":12, "font-weight":700, "text-anchor":"middle", "font-family":"var(--mono)"}, m.r2.toFixed(3)));
      s.appendChild(el("text", {x, y:H-18, fill:"#8fa3bd", "font-size":11, "text-anchor":"middle"}, lab));
      const b = d.bootstrap[key];
      if(b){
        const lo = Math.max(minV, b.ci_low), hi = Math.min(maxV, b.ci_high);
        if(hi > lo){
          const cx = x;
          s.appendChild(el("line", {x1:cx-5, x2:cx+5, y1:y(lo), y2:y(lo), stroke:"#e9f0f8", "stroke-width":1, opacity:.55}));
          s.appendChild(el("line", {x1:cx-5, x2:cx+5, y1:y(hi), y2:y(hi), stroke:"#e9f0f8", "stroke-width":1, opacity:.55}));
          s.appendChild(el("line", {x1:cx, x2:cx, y1:y(lo), y2:y(hi), stroke:"#e9f0f8", "stroke-width":1, opacity:.55, "stroke-dasharray":"2 3"}));
        }
      }
    });
    s.appendChild(el("text", {x:14, y:pad.t+4, fill:"#64748b", "font-size":10, transform:"rotate(-90 14 " + (pad.t+4) + ")"}, "R²"));
    mount.appendChild(s);
  }

  function bpbChart(mount){
    const W = 720, H = 340, pad = {l:44, r:120, t:18, b:44};
    const s = svgRoot(W, H); s.setAttribute("aria-label", "Bits per byte by vocabulary size for six corpora");
    const xs = [8192, 16384, 32768];
    const x = v => pad.l + (Math.log2(v) - Math.log2(8192)) / (Math.log2(32768) - Math.log2(8192)) * (W - pad.l - pad.r);
    const ymin = 1.35, ymax = 2.7;
    const y = v => pad.t + (ymax - v) / (ymax - ymin) * (H - pad.t - pad.b);
    [1.5,1.75,2.0,2.25,2.5].forEach(v => {
      s.appendChild(el("line", {x1:pad.l, x2:W-pad.r, y1:y(v), y2:y(v), stroke:"rgba(148,163,184,.1)", "stroke-width":1}));
      s.appendChild(el("text", {x:pad.l-8, y:y(v)+3, fill:"#64748b", "font-size":10, "text-anchor":"end", "font-family":"var(--mono)"}, v.toFixed(2)));
    });
    xs.forEach(v => s.appendChild(el("text", {x:x(v), y:H-18, fill:"#8fa3bd", "font-size":11, "text-anchor":"middle", "font-family":"var(--mono)"}, (v/1024)+"k")));
    s.appendChild(el("text", {x:W-pad.r+8, y:pad.t+10, fill:"#64748b", "font-size":10}, "BPB"));
    const colors = {"wikitext_en":"#5eead4","codeparrot_py":"#fbbf24","wikipedia_zh":"#f472b6","wikipedia_hu":"#a78bfa","wikipedia_ar":"#22d3ee","wikipedia_sw":"#fb7185"};
    DATA.corpora.forEach(c => {
      const rows = DATA.bpb_summary.filter(d => d.corpus === c.id).sort((a,b) => a.requested_vocab_size - b.requested_vocab_size);
      if(!rows.length) return;
      const path = rows.map((d,i) => (i?"L":"M") + x(d.requested_vocab_size).toFixed(1) + "," + y(d.bpb_mean).toFixed(1)).join(" ");
      s.appendChild(el("path", {d:path, fill:"none", stroke:colors[c.id] || "#94a3b8", "stroke-width":2.2, "stroke-linecap":"round", opacity:.9}));
      rows.forEach(d => s.appendChild(el("circle", {cx:x(d.requested_vocab_size), cy:y(d.bpb_mean), r:3.2, fill:colors[c.id] || "#94a3b8"})));
      const last = rows[rows.length-1];
      s.appendChild(el("text", {x:x(last.requested_vocab_size)+9, y:y(last.bpb_mean)+3.5, fill:colors[c.id] || "#94a3b8", "font-size":10, "font-family":"var(--mono)"}, c.label.replace(" Wikipedia","").replace("Python code","Python")));
    });
    mount.appendChild(s);
    $("#bpbLegend").innerHTML = DATA.corpora.map(c => `<span><i style="background:${colors[c.id]}"></i>${esc(c.label)}</span>`).join("");
  }

  function deltaChart(mount){
    const groups = DATA.h1.per_group.slice().sort((a,b) => (a.full.mae - a.baseline.mae) - (b.full.mae - b.baseline.mae));
    const W = 520, H = 300, pad = {l:110, r:24, t:16, b:34};
    const s = svgRoot(W, H); s.setAttribute("aria-label", "Change in MAE by corpus when adding topology");
    const maxAbs = Math.max(...groups.map(g => Math.abs(g.full.mae - g.baseline.mae)), .1);
    const x = v => pad.l + (v + maxAbs) / (2*maxAbs) * (W - pad.l - pad.r);
    s.appendChild(el("line", {x1:x(0), x2:x(0), y1:pad.t, y2:H-pad.b, stroke:"rgba(148,163,184,.4)", "stroke-width":1}));
    groups.forEach((g, i) => {
      const delta = g.full.mae - g.baseline.mae;
      const yy = pad.t + i * ((H-pad.t-pad.b)/groups.length) + 8;
      const w = Math.abs(x(delta) - x(0));
      s.appendChild(el("rect", {x: delta < 0 ? x(delta) : x(0), y:yy, width:Math.max(2,w), height:15, rx:4, fill: delta < 0 ? "#5eead4" : "#fb7185", opacity:.8}));
      s.appendChild(el("text", {x:pad.l-10, y:yy+12, fill:"#b6c5d8", "font-size":10.5, "text-anchor":"end"}, labelOf(g.group)));
      s.appendChild(el("text", {x: delta < 0 ? x(delta)-6 : x(delta)+6, y:yy+12, fill: delta < 0 ? "#5eead4" : "#fb7185", "font-size":10, "text-anchor": delta < 0 ? "end" : "start", "font-family":"var(--mono)"}, (delta>0?"+":"") + delta.toFixed(3)));
    });
    s.appendChild(el("text", {x:x(0), y:H-8, fill:"#64748b", "font-size":9.5, "text-anchor":"middle"}, "← better with topology · worse with topology →"));
    mount.appendChild(s);
  }

  function marketChart(mount){
    const W = 520, H = 300, pad = {l:46, r:20, t:18, b:42};
    const s = svgRoot(W, H); s.setAttribute("aria-label", "Market compression versus bits per byte");
    const xs = DATA.market.map(m => m.compression), ys = DATA.market.map(m => m.bpb);
    const xmin = Math.min(...xs)*.98, xmax = Math.max(...xs)*1.02;
    const ymin = Math.min(...ys)*.98, ymax = Math.max(...ys)*1.02;
    const x = v => pad.l + (v-xmin)/(xmax-xmin)*(W-pad.l-pad.r);
    const y = v => pad.t + (ymax-v)/(ymax-ymin)*(H-pad.t-pad.b);
    for(let i=0;i<=4;i++){
      const v = ymin + (ymax-ymin)*i/4;
      s.appendChild(el("line", {x1:pad.l, x2:W-pad.r, y1:y(v), y2:y(v), stroke:"rgba(148,163,184,.1)"}));
      s.appendChild(el("text", {x:pad.l-7, y:y(v)+3, fill:"#64748b", "font-size":9, "text-anchor":"end", "font-family":"var(--mono)"}, v.toFixed(1)));
    }
    DATA.market.forEach(m => {
      s.appendChild(el("circle", {cx:x(m.compression), cy:y(m.bpb), r:5.5, fill:"#22d3ee", opacity:.75, stroke:"#05080d", "stroke-width":1.5}));
      s.appendChild(el("text", {x:x(m.compression), y:y(m.bpb)-10, fill:"#8fa3bd", "font-size":8.5, "text-anchor":"middle", "font-family":"var(--mono)"}, m.ticker));
    });
    s.appendChild(el("text", {x:(pad.l+W-pad.r)/2, y:H-10, fill:"#64748b", "font-size":10, "text-anchor":"middle"}, "compression · bytes per token →"));
    s.appendChild(el("text", {x:12, y:pad.t+6, fill:"#64748b", "font-size":10, transform:`rotate(-90 12 ${pad.t+6})`}, "BPB"));
    mount.appendChild(s);
  }

  r2Chart($("#chartH1"), DATA.h1, "H1 R squared by model");
  r2Chart($("#chartH2"), DATA.h2, "H2 R squared by model");
  bpbChart($("#chartBpb"));
  deltaChart($("#chartDelta"));
  marketChart($("#chartMarket"));

  /* ---------- result tables ---------- */
  function metricRow(m, b, label){
    return `<tr><td>${label}</td><td class="mono">${fmt(m.r2,3)}</td><td class="mono">${fmt(m.mae,3)}</td><td class="mono">[${fmt(b?b.ci_low:null,2)}, ${fmt(b?b.ci_high:null,2)}]</td></tr>`;
  }
  $("#h1Table").innerHTML = [["baseline","Baseline",DATA.h1.metrics.baseline],["full","+ Topology",DATA.h1.metrics.full],["topology","Topology only",DATA.h1.metrics.topology]].map(([k,l,m]) => metricRow(m, DATA.h1.bootstrap[k], l)).join("");
  $("#h2Table").innerHTML = [["baseline","Baseline",DATA.h2.metrics.baseline],["full","+ Topology",DATA.h2.metrics.full],["topology","Topology only",DATA.h2.metrics.topology]].map(([k,l,m]) => metricRow(m, DATA.h2.bootstrap[k], l)).join("");

  const h3 = DATA.h3.variables.slice().sort((a,b) => a.p_value - b.p_value);
  $("#h3Table").innerHTML = h3.map(v => {
    const isCooc = v.variable === "cooc_h1_total_persistence";
    return `<tr><td>${esc(v.variable)}</td><td class="mono">${fmt(v.rho,3)}</td><td class="mono">${v.p_value < 0.001 ? v.p_value.toExponential(2) : fmt(v.p_value,3)}</td><td class="mono">[${fmt(v.ci_low,2)}, ${fmt(v.ci_high,2)}]</td><td><span class="badge ${isCooc?"ok":""}">${isCooc?"0.024":"1.000"}</span></td></tr>`;
  }).join("");

  /* ---------- data table ---------- */
  let sortKey = "compression", sortDir = -1, filter = "all";
  function renderTable(){
    const tbody = $("#tokenTable tbody");
    let rows = DATA.tokenizers.filter(r => filter === "all" || r.family === filter);
    rows.sort((a,b) => {
      const av = a[sortKey], bv = b[sortKey];
      if(av === null && bv === null) return 0;
      if(av === null) return 1;
      if(bv === null) return -1;
      return (av > bv ? 1 : av < bv ? -1 : 0) * sortDir;
    });
    const maxC = Math.max(...rows.map(r => r.compression));
    tbody.innerHTML = rows.map(r => `<tr>
      <td>${esc(r.label)}</td>
      <td><span class="fam ${r.family}">${r.family.toUpperCase()}</span></td>
      <td class="num">${r.vocab.toLocaleString()}</td>
      <td><div class="bar-cell"><span class="num">${fmt(r.compression,3)}</span><span class="mini" style="width:${Math.round(r.compression/maxC*54)}px"></span></div></td>
      <td class="num">${r.bpb === null ? "—" : fmt(r.bpb,3)}</td>
      <td class="num">${fmt(r.byte_entropy,2)}</td>
      <td class="num">${fmt(r.h1_total,2)}</td>
    </tr>`).join("");
  }
  $$("#tableFilters .chip").forEach(ch => ch.addEventListener("click", () => {
    filter = ch.dataset.filter;
    $$("#tableFilters .chip").forEach(c => c.classList.toggle("on", c === ch));
    renderTable();
  }));
  $$("#tokenTable th").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.sort;
    if(sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = k === "label" || k === "family" ? 1 : -1; }
    renderTable();
  }));
  renderTable();
